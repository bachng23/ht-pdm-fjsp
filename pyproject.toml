[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ht-pdm-fjsp"
version = "0.1.0"
description = "Minimal reproducible HT-PdM-FJSP benchmark environment."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.1,<2",
    "numpy>=2.1,<3",
    "ortools>=9.11,<10",
    "rich>=13.9,<15",
    "sb3-contrib>=2.6,<3",
    "stable-baselines3>=2.6,<3",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
ht-pdm-fjsp-benchmark = "ht_pdm_fjsp.benchmark:main"
ht-pdm-fjsp-gym-benchmark = "ht_pdm_fjsp.gym_benchmark:main"
ht-pdm-fjsp-ppo = "ht_pdm_fjsp.rl_experiment:main"
ht-pdm-fjsp-ppo-replicates = "ht_pdm_fjsp.multi_seed_experiment:main"
ht-pdm-fjsp-ppo-select = "ht_pdm_fjsp.checkpoint_selection:main"
ht-pdm-fjsp-ppo-diagnostics = "ht_pdm_fjsp.ppo_diagnostics:main"
ht-pdm-fjsp-ppo-route-guard = "ht_pdm_fjsp.route_guard_experiment:main"
ht-pdm-fjsp-shared-action-ppo = "ht_pdm_fjsp.shared_policy_experiment:main"
ht-pdm-fjsp-entity-conditioned-ppo = "ht_pdm_fjsp.entity_conditioned_experiment:main"
ht-pdm-fjsp-preventive-shortcut = "ht_pdm_fjsp.preventive_shortcut_diagnostic:main"
ht-pdm-fjsp-production-context-ppo = "ht_pdm_fjsp.production_context_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
