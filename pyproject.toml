[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ht-pdm-fjsp"
version = "0.1.0"
description = "Minimal reproducible HT-PdM-FJSP benchmark environment."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.1,<2",
    "numpy>=2.1,<3",
    "ortools>=9.11,<10",
    "rich>=13.9,<15",
    "sb3-contrib>=2.6,<3",
    "stable-baselines3>=2.6,<3",
    "torch==2.14.0",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
ht-pdm-fjsp-benchmark = "ht_pdm_fjsp.benchmark:main"
ht-pdm-fjsp-gym-benchmark = "ht_pdm_fjsp.gym_benchmark:main"
ht-pdm-fjsp-ppo = "ht_pdm_fjsp.rl_experiment:main"
ht-pdm-fjsp-ppo-replicates = "ht_pdm_fjsp.multi_seed_experiment:main"
ht-pdm-fjsp-ppo-select = "ht_pdm_fjsp.checkpoint_selection:main"
ht-pdm-fjsp-ppo-diagnostics = "ht_pdm_fjsp.ppo_diagnostics:main"
ht-pdm-fjsp-ppo-route-guard = "ht_pdm_fjsp.route_guard_experiment:main"
ht-pdm-fjsp-shared-action-ppo = "ht_pdm_fjsp.shared_policy_experiment:main"
ht-pdm-fjsp-entity-conditioned-ppo = "ht_pdm_fjsp.entity_conditioned_experiment:main"
ht-pdm-fjsp-preventive-shortcut = "ht_pdm_fjsp.preventive_shortcut_diagnostic:main"
ht-pdm-fjsp-production-context-ppo = "ht_pdm_fjsp.production_context_experiment:main"
ht-pdm-fjsp-production-context-diagnostic = "ht_pdm_fjsp.production_context_diagnostic:main"
ht-pdm-fjsp-residual-context-ppo = "ht_pdm_fjsp.residual_context_experiment:main"
ht-pdm-fjsp-route-preserving-residual = "ht_pdm_fjsp.route_preserving_residual_experiment:main"
ht-pdm-fjsp-route-reroute-diagnostic = "ht_pdm_fjsp.route_preserving_reroute_diagnostic:main"
ht-pdm-fjsp-conflict-aware-residual = "ht_pdm_fjsp.conflict_aware_residual_experiment:main"
ht-pdm-fjsp-ctde-mappo = "ht_pdm_fjsp.ctde_experiment:main"
ht-pdm-fjsp-marl-diagnostic = "ht_pdm_fjsp.marl_diagnostic_experiment:main"
ht-pdm-fjsp-marl-factorial = "ht_pdm_fjsp.marl_factorial_experiment:main"
ht-pdm-fjsp-marl-replication = "ht_pdm_fjsp.marl_replication_experiment:main"
ht-pdm-fjsp-marl-risk-guard = "ht_pdm_fjsp.marl_risk_guard_experiment:main"
ht-pdm-fjsp-technician-conflicts = "ht_pdm_fjsp.technician_conflict_experiment:main"
ht-pdm-fjsp-technician-noop = "ht_pdm_fjsp.technician_noop_experiment:main"
ht-pdm-fjsp-shadow-demand = "ht_pdm_fjsp.shadow_technician_demand:main"
ht-pdm-fjsp-technician-capacity = "ht_pdm_fjsp.technician_capacity_screening:main"
ht-pdm-fjsp-three-way-marl = "ht_pdm_fjsp.three_way_marl_experiment:main"
ht-pdm-fjsp-marl-budget-screen = "ht_pdm_fjsp.marl_budget_screening:main"
ht-pdm-fjsp-qmix-fidelity = "ht_pdm_fjsp.qmix_fidelity_experiment:main"
ht-pdm-fjsp-resource-graph = "ht_pdm_fjsp.resource_conflict_graph_experiment:main"
ht-pdm-fjsp-environment-attribution = "ht_pdm_fjsp.environment_attribution_experiment:main"
ht-pdm-fjsp-qplex-soft-graph = "ht_pdm_fjsp.qplex_soft_graph_experiment:main"
ht-pdm-fjsp-technician-factorial = "ht_pdm_fjsp.technician_conflict_factorial:main"
ht-pdm-fjsp-technician-window-calibration = "ht_pdm_fjsp.technician_window_calibration:main"
ht-pdm-fjsp-technician-cluster-mixture = "ht_pdm_fjsp.technician_cluster_mixture:main"
ht-pdm-fjsp-parallel-maintenance = "ht_pdm_fjsp.parallel_maintenance_experiment:main"
ht-pdm-fjsp-parallel-calibration = "ht_pdm_fjsp.parallel_maintenance_calibration:main"
ht-pdm-fjsp-conflict-consequence = "ht_pdm_fjsp.conflict_consequence:main"
ht-pdm-fjsp-clean-conflict = "ht_pdm_fjsp.clean_conflict_attribution:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
